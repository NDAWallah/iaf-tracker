name: Build Android APK

on:
  workflow_dispatch: # यह GitHub पर "Run workflow" का बटन बनाता है

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Bundle Web Assets
        run: |
          mkdir -p www
          cp -r index.html style.css script.js www/ || true
          cp -r *.png *.jpg *.jpeg *.svg www/ 2>/dev/null || true

      - name: Create Capacitor Android Project
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init "IAF Tracker" "com.ndawallah.iaftracker" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build Offline APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IAF-Tracker-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
